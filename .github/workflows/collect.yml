name: gifthawk-collector
on:
  schedule: [{ cron: '*/15 * * * *' }]
  workflow_dispatch:
    inputs:
      refresh_tokens: { description: 'تجدید توکن (1 = بله)', default: '0' }
concurrency: { group: collector, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r userbot/requirements.txt
      - run: python userbot/collector.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          REFRESH_TOKENS: ${{ github.event.inputs.refresh_tokens }}
          RUN_MINUTES: '54'
